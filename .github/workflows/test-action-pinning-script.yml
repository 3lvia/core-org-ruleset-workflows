name: Test action pinning script

on:
  pull_request:
    paths:
      - '.github/scripts/verify_action_pinning.py'
      - '.github/scripts/test_verify_action_pinning.py'
      - '.github/workflows/verify-action-pinning.yml'
      - '.github/workflows/test-action-pinning-script.yml'
  push:
    branches:
      - main
      - master
      - trunk
    paths:
      - '.github/scripts/verify_action_pinning.py'
      - '.github/scripts/test_verify_action_pinning.py'
      - '.github/workflows/verify-action-pinning.yml'
      - '.github/workflows/test-action-pinning-script.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Run pinning script tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
