name: Verify action pinning policy

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - trunk

permissions:
  contents: read

jobs:
  verify:
    name: verify-action-pinning
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Validate workflows
        shell: bash
        run: |
          python3 - <<'PY'
          # Verify action pinning policy script embedded here - must be same as .github/scripts/verify_action_pinning.py
          # BEGIN verify_action_pinning.py
          import re
          from pathlib import Path

          import yaml

          SHA = re.compile(r"[0-9a-fA-F]{40}")
          DOCKER_DIGEST = re.compile(r"sha256:[0-9a-fA-F]{64}")


          def find_uses(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "uses" and isinstance(value, str):
                          yield value
                      else:
                          yield from find_uses(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from find_uses(item)


          def is_pinned(uses):
              if uses.startswith(("./", "$/")):
                  return True

              if uses.startswith("docker://"):
                  _, separator, digest = uses.rpartition("@")
                  return bool(separator and DOCKER_DIGEST.fullmatch(digest))

              target, separator, ref = uses.rpartition("@")
              parts = target.split("/")
              if not separator or not ref or len(parts) < 2 or not all(parts[:2]):
                  return False

              return parts[0].lower() == "3lvia" or bool(SHA.fullmatch(ref))


          def main():
              workflow_dir = Path(".github/workflows")
              if not workflow_dir.exists():
                  print("No .github/workflows directory found; nothing to validate.")
                  return 0

              failed = False
              workflows = sorted(workflow_dir.glob("*.y*ml"))

              for file in workflows:
                  try:
                      workflow = yaml.safe_load(file.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, yaml.YAMLError) as exc:
                      print(f"::error file={file}::Could not read or parse YAML: {exc}")
                      failed = True
                      continue

                  for uses in find_uses(workflow):
                      if not is_pinned(uses):
                          print(f"::error file={file}::Action is not pinned according to policy: {uses}")
                          failed = True

              if failed:
                  return 1

              print(f"All actions in {len(workflows)} workflow file(s) comply with pinning policy.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          # END verify_action_pinning.py
          PY
